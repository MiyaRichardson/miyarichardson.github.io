<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Miya Richardson | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { raspberry: "#C2185B", ink: "#111111", sketchgrey: "#777777", paper: "#FFFFFF", warmbg: "#F5F5F7" }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Patrick Hand', cursive; background-color: #F5F5F7; color: #111111; font-size: 1.7rem; perspective: 1500px; }
    .sketchbook-container { background-color: #F5F5F7; background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0); background-size: 24px 24px; }
    .paper-sheet {
      background-color: #FFFFFF;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), inset 0 0 40px rgba(0,0,0,0.02);
      transform-origin: left center;
      transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1), opacity 0.5s ease;
    }
    .page-turn-exit-forward { transform: rotateY(-140deg) scale(0.95); opacity: 0; }
    .hand-box { border: 2px solid #111111; border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; }
    .typed-cursor { opacity: 1; animation: blink 0.7s infinite; color: #C2185B; font-weight: bold; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body class="sketchbook-container min-h-screen flex items-center justify-center p-4 md:p-8 overflow-x-hidden">

  <div class="w-full max-w-6xl flex relative">
    
    <div id="notebook-page" class="paper-sheet w-full rounded-2xl p-6 md:p-12 min-h-[85vh] relative flex flex-col justify-between border border-black/5 mr-12 md:mr-16">
      
      <div class="w-full flex justify-end items-center mb-6">
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="text-2xl font-bold hover:text-raspberry transition-colors flex items-center gap-1">
          GitHub ↗
        </a>
      </div>

      <div class="my-auto max-w-2xl w-full mx-auto space-y-6 text-center md:text-left">
        <div class="space-y-2">
          <p class="text-4xl font-bold text-ink">Hey, I'm Miya ✦</p>
          <h1 class="text-5xl md:text-6xl font-bold text-raspberry leading-tight min-h-[140px] md:min-h-[120px]">
            User Experience Designer & <br class="hidden md:block"/>
            <span id="typing-text"></span><span class="typed-cursor">|</span>
          </h1>
        </div>
        
        <p class="text-3xl text-sketchgrey max-w-xl leading-relaxed">
          Finding the core patterns in complex chaos, mapping intuitive journeys, and designing products that feel natural to use.
        </p>

        <div class="pt-4 flex flex-col sm:flex-row gap-6 justify-center md:justify-start">
          <a href="projects.html" class="hand-box px-8 py-3 bg-raspberry text-white font-bold text-2xl text-center hover:bg-raspberry/90 transition-all inline-block shadow-sm nav-link">
            View Case Studies ➔
          </a>
          <a href="about.html" class="hand-box px-8 py-3 bg-white text-ink border-2 border-ink font-bold text-2xl text-center hover:bg-warmbg transition-all inline-block nav-link">
            About My Work
          </a>
        </div>
      </div>

      <div class="w-full flex justify-between items-end mt-12 pt-4 border-t border-dashed border-ink/10">
        <p class="text-xl text-sketchgrey">UX Portfolio</p>
        <p class="text-2xl text-sketchgrey font-bold">Page [ 01 ]</p>
      </div>

    </div>

    <nav class="absolute right-0 top-12 h-[70vh] flex flex-col justify-start space-y-4 w-12 md:w-16 z-50 text-2xl font-bold">
      <a href="index.html" class="bg-raspberry text-white py-4 text-center rounded-r-lg border border-l-0 border-black/10 shadow-sm [writing-mode:vertical-lr]">Home</a>
      <a href="projects.html" class="bg-warmbg text-ink hover:text-raspberry py-4 text-center rounded-r-lg border border-l-0 border-black/10 shadow-sm transition-all [writing-mode:vertical-lr] nav-link">Projects</a>
      <a href="about.html" class="bg-warmbg text-ink hover:text-raspberry py-4 text-center rounded-r-lg border border-l-0 border-black/10 shadow-sm transition-all [writing-mode:vertical-lr] nav-link">About</a>
    </nav>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const phrases = [
        "Interaction Designer.",
        "User Researcher.",
        "Human Centred Problem Solver."
      ];
      
      let currentPhraseIdx = 0;
      let currentCharIdx = phrases[0].length;
      let isDeleting = false;
      const typingSpeed = 80;
      const deletingSpeed = 40;
      const pauseTime = 2000;
      const textEl = document.getElementById('typing-text');
      
      textEl.textContent = phrases[0];

      function typeCycle() {
        const currentFullText = phrases[currentPhraseIdx];
        
        if (isDeleting) {
          textEl.textContent = currentFullText.substring(0, currentCharIdx - 1);
          currentCharIdx--;
        } else {
          textEl.textContent = currentFullText.substring(0, currentCharIdx + 1);
          currentCharIdx++;
        }

        if (!isDeleting && currentCharIdx === currentFullText.length) {
          isDeleting = true;
          setTimeout(typeCycle, pauseTime);
          return;
        }

        if (isDeleting && currentCharIdx === 0) {
          isDeleting = false;
          currentPhraseIdx = (currentPhraseIdx + 1) % phrases.length;
          setTimeout(typeCycle, 300);
          return;
        }

        setTimeout(typeCycle, isDeleting ? deletingSpeed : typingSpeed);
      }

      setTimeout(() => { isDeleting = true; typeCycle(); }, pauseTime);

      const page = document.getElementById('notebook-page');
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const destination = this.getAttribute('href');
          page.classList.add('page-turn-exit-forward');
          setTimeout(() => { window.location.href = destination; }, 550);
        });
      });
    });
  </script>
</body>
</html
